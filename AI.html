// =================== DATE ===================
function formatNumber(n) {
    return n < 10 ? '0' + n : n;
  }

  function getDateTime(isEng = false) {
    const now = new Date();
    const year = now.getFullYear();
    const month = formatNumber(now.getMonth() + 1);
    const day = formatNumber(now.getDate());
    const hour = formatNumber(now.getHours());
    const minute = formatNumber(now.getMinutes());

    if (isEng) {
      return `${year}/${month}/${day} <br>Time is Now = ${hour}:${minute}`;
    } else {
      return `${year}/${month}/${day} <br>Jam = ${hour}:${minute}`;
    }
  }

  function updateClockAndGreet(isEng = false) {
  const clockId = isEng ? "digital-clock-eng" : "digital-clock";
  const greetId = isEng ? "greet-time-eng" : "greet-time";

  // update clock
  document.getElementById(clockId).innerHTML = getDateTime(isEng);

  // update greet
  const hrs = new Date().getHours();
  let greet;
  if (isEng) {
    if (hrs < 12) greet = 'Morning';
    else if (hrs < 17) greet = 'Afternoon';
    else greet = 'Evening';
  } else {
    if (hrs < 12) greet = 'Pagi';
    else if (hrs < 17) greet = 'Sore';
    else greet = 'Malam';
  }
  document.getElementById(greetId).innerHTML = greet + ' ^_^';
}


  function greetTime(isEng = false) {
    const hrs = new Date().getHours();
    let greet;
    if (isEng) {
      if (hrs < 12) greet = 'Morning';
      else if (hrs < 17) greet = 'Afternoon';
      else greet = 'Evening';
      document.getElementById('greet-time-eng').innerHTML = greet + ' ^_^';
    } else {
      if (hrs < 12) greet = 'Pagi';
      else if (hrs < 17) greet = 'Sore';
      else greet = 'Malam';
      document.getElementById('greet-time').innerHTML = greet + ' ^_^';
    }
  }

  setInterval(() => {
    document.getElementById("digital-clock").innerHTML = getDateTime();
    greetTime();
  }, 1000);
